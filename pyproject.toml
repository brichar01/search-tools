[project]
name = "search-tool"
version = "0.1.0"
description = "Aggregate local, cheatsheet, manual and Confluence searches behind one command"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pyyaml>=6.0.2",
    "model2vec>=0.9",
    "numpy>=2.0",
    "huggingface-hub>=1.0",
    "textual>=8.2.8",
    "nltk>=3.10.3",
]

[project.scripts]
search-tool = "search_tool.cli:run"
search-tool-precache = "search_tool.precache:run"
search-tool-semantic = "search_tool.semantic:run"
search-tool-help-index = "search_tool.help_index:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/search_tool"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "black>=24.10",
]

[tool.black]
line-length = 88
target-version = ["py314"]
extend-exclude = "tldr"

[tool.ruff]
line-length = 88
src = ["src", "tests"]
exclude = ["tldr"]

[tool.ruff.lint]
extend-select = ["D", "I", "UP", "B"]
ignore = ["D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D103"]

[tool.pytest.ini_options]
testpaths = ["tests"]
